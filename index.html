<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Mobile design</title>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,700&display=swap" rel="stylesheet">
    </head>
    <style>
        .back {
            background-color: hsla(30, 38%, 92%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            cursor: zoom-in;
        }
        .pic {
            height: 450px;
            width: 300px;
            object-fit: cover;
            border-radius: 10px 0 0 10px;
            
        }
        img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sec {
            background-color: white;
            height: 450px;
            width: 300px;
            border-radius: 0 10px 10px 0;
            padding: 32px;
            box-sizing: border-box;
        }
        .desc {
            color: hsl(228, 12%, 48%);
            font-family: 'Montserrat';
            letter-spacing: 5px;
            font-size: 12px;
        }
        .how {
            font-weight: 700;
            font-size: 32px;
            line-height: 32px;
            color: hsl(212, 21%, 14%);
            font-family: fraunces;
            margin: 20px 0;
        }
        .ads {
            font-family: Montserrat;
            font-size: 14px;
            font-weight: 500px;
            line-height: 23px;
            color: hsl(228, 12%, 48%);
            margin-bottom: 25px;
        }
        .price {
            font-family: fraunces;
            color: hsl(158, 36%, 37%);
            font-size: 32px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .sub {
            font-family: Montserrat;
            color:  hsl(228, 12%, 48%);
            font-size: 13px;
            font-weight: 500;
            text-decoration: line-through;
        }
        .add {
            background-color: hsl(158, 36%, 37%);
            color: white;
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: Montserrat;
            font-size: 20px;
            font-weight: 700;
            padding: 15px;
            margin-top: 10px;
            cursor: pointer;
            opacity: 0.15s;
        }

        .add:hover {
            opacity: 0.8;
        }

        .pre {
            display: flex;
            width:min(92%, 600px);
            border-radius: 10px;
            overflow: hidden;
        }

        /* For phone - 600px and below */
        @media (max-width: 720px) {
            .back {
                padding: 1rem;
                align-items: flex-start;
               
            }

            .pre {
                flex-direction: column;
                width: 100%;
            }

            .pic {
                width: 100%;
                height: 300px;
                object-fit: contain;
            }

            .sec {
                width: 100%;
                min-height: auto;
                padding: 1.5rem;
            }
        }
    
    </style>
    <body>
        <main class="back">
               <section class="pre">
                    <div class="pic">
                        <img src="product.jpg">
                    </div>
                    <div class="sec">
                        <p class="desc">PERFUME</p>
                        <h2 class="how">Gabrielle Essence Eau De Parfum</h2>
                        <p class="ads">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL</p>
                        <h2 class="price">$149.99 <span class="sub">$169.99</span></h2>
                        <div>
                            <button class="add">Add to Cart</button>
                        </div>
                    </div>
                </section>
              
            
        </main>
    </body>
</html>
